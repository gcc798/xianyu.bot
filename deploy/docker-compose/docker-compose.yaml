name: go.xianyu.assistant

networks:
  default:
    name: go.xianyu.assistant

volumes:
  postgres:
  rustfs:
  redis:

services:
  web:
    build:
      context: ../../web
      dockerfile: ./Dockerfile
    container_name: gva-web
    restart: always
    ports:
      - '8080:8080'
    depends_on:
      - server
    command: ['nginx-debug', '-g', 'daemon off;']

  server:
    build:
      context: ../../server
      dockerfile: ./Dockerfile
    container_name: gva-server
    restart: always
    ports:
      - '8888:8888'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    container_name: gva-postgres
    restart: always
    ports:
      - '${PGSQL_HOST_PORT:-15432}:5432'
    environment:
      POSTGRES_DB: xianyu
      POSTGRES_USER: xianyu
      POSTGRES_PASSWORD: ${PGSQL_PASSWORD:-xianyu-local-only}
      TZ: Asia/Shanghai
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U xianyu -d xianyu']
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - postgres:/var/lib/postgresql/data

  rustfs:
    image: rustfs/rustfs:latest
    container_name: gva-rustfs
    restart: always
    command: ['--address', ':9000', '--console-enable', '--console-address', ':9001', '/data']
    ports:
      - '${RUSTFS_API_HOST_PORT:-19000}:9000'
      - '${RUSTFS_CONSOLE_HOST_PORT:-19001}:9001'
    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-rustfs-local}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:-rustfs-local-secret}
      RUSTFS_ADDRESS: ':9000'
      RUSTFS_CONSOLE_ADDRESS: ':9001'
      RUSTFS_CONSOLE_ENABLE: 'true'
    volumes:
      - rustfs:/data

  redis:
    image: redis:7-alpine
    container_name: gva-redis
    restart: always
    ports:
      - '16379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 3
    volumes:
      - redis:/data

  telegram:
    build:
      context: ../../script/tel-bot
      dockerfile: Dockerfile
    container_name: gva-telegram
    restart: unless-stopped
    env_file:
      - path: ../../script/tel-bot/.env
        required: false
    ports:
      - '127.0.0.1:8081:8080'
    volumes:
      - ../../script/tel-bot/data:/app/data
