name: go.xy.assistant

networks:
  default:
    name: go.xy.assistant

volumes:
  postgres:
  rustfs:
  redis:

services:
  web:
    build:
      context: ../..
      dockerfile: ./web/Dockerfile
    container_name: gva-web
    restart: always
    ports:
      - '18080:8080'
    depends_on:
      - server
    command: ['nginx-debug', '-g', 'daemon off;']

  server:
    build:
      context: ../../server
      dockerfile: ./Dockerfile
    container_name: gva-server
    restart: always
    ports:
      - '18888:8888'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      XY_CREDENTIAL_KEY: ${XY_CREDENTIAL_KEY:-}
      GVA_ADMIN_PASSWORD: ${GVA_ADMIN_PASSWORD:-123456}
      TELEGRAM_SERVICE_URL: http://telegram:8080
      TELEGRAM_INTERNAL_TOKEN: ${TELEGRAM_INTERNAL_TOKEN:-}
      RUSTFS_ENDPOINT: http://rustfs:9000
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-rustfs-local}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:-rustfs-local-secret}
      RUSTFS_BUCKET: ${RUSTFS_BUCKET:-telegram-resources}

  postgres:
    image: postgres:17-alpine
    container_name: gva-postgres
    restart: always
    ports:
      - '${PGSQL_HOST_PORT:-15432}:5432'
    environment:
      POSTGRES_DB: xianyu_assistant_v2
      POSTGRES_USER: xianyu
      POSTGRES_PASSWORD: ${PGSQL_PASSWORD:-xianyu_assistant}
      TZ: Asia/Shanghai
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U xianyu -d xianyu_assistant_v2']
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - postgres:/var/lib/postgresql/data

  rustfs:
    image: rustfs/rustfs:latest
    container_name: gva-rustfs
    restart: always
    command: ['--address', ':9000', '--console-enable', '--console-address', ':9001', '/data']
    ports:
      - '${RUSTFS_API_HOST_PORT:-19000}:9000'
      - '${RUSTFS_CONSOLE_HOST_PORT:-19001}:9001'
    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-rustfs-local}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:-rustfs-local-secret}
      RUSTFS_ADDRESS: ':9000'
      RUSTFS_CONSOLE_ADDRESS: ':9001'
      RUSTFS_CONSOLE_ENABLE: 'true'
    volumes:
      - rustfs:/data

  redis:
    image: redis:7-alpine
    container_name: gva-redis
    restart: always
    ports:
      - '16379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 3
    volumes:
      - redis:/data

  telegram:
    build:
      context: ../../script/tel-bot
      dockerfile: Dockerfile
    container_name: gva-telegram
    restart: unless-stopped
    env_file:
      - path: ../../script/tel-bot/.env
        required: false
    environment:
      DATABASE_URL: postgresql://xianyu:xianyu_assistant@postgres:5432/xianyu_assistant_v2
      TELEGRAM_INTERNAL_TOKEN: ${TELEGRAM_INTERNAL_TOKEN:-}
      GVA_INTERNAL_URL: http://server:8888
      TG_RESOURCE_CONCURRENCY: ${TG_RESOURCE_CONCURRENCY:-1}
      TG_RESOURCE_MAX_FILE_MB: ${TG_RESOURCE_MAX_FILE_MB:-200}
      TG_RESOURCE_AI_BASE_URL: ${TG_RESOURCE_AI_BASE_URL:-}
      TG_RESOURCE_AI_API_KEY: ${TG_RESOURCE_AI_API_KEY:-}
      TG_RESOURCE_AI_MODEL: ${TG_RESOURCE_AI_MODEL:-}
      TELEGRAM_TMP_ROOT: /workspace/tmp/telegram
      RUSTFS_ENDPOINT: http://rustfs:9000
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-rustfs-local}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:-rustfs-local-secret}
      RUSTFS_BUCKET: ${RUSTFS_BUCKET:-telegram-resources}
      RUSTFS_REGION: ${RUSTFS_REGION:-us-east-1}
    depends_on:
      postgres:
        condition: service_healthy
      rustfs:
        condition: service_started
    ports:
      - '127.0.0.1:18081:8080'
    volumes:
      - ../../tmp:/workspace/tmp
