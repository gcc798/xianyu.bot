<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>{% block title %}Telegram Analyzer & Cleaner{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="/static/app.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg bg-dark navbar-dark mb-4">
  <div class="container-fluid"><a class="navbar-brand" href="/">Telegram Analyzer & Cleaner</a>
    <div class="navbar-nav">
      {% if authorized %}<a class="nav-link" href="/groups">群聊与频道</a>{% endif %}
      <a class="nav-link" href="/settings">设置</a>
    </div>
    {% if account %}<span class="navbar-text">{{ account }}</span>{% endif %}
  </div>
</nav>
<main class="container-fluid px-lg-4">{% block content %}{% endblock %}</main>
<script src="/static/app.js?v=20261003-2"></script>
{% block scripts %}{% endblock %}
</body></html>
