{% extends "base.html" %}{% block content %}<h1 class="h3">设置</h1><div class="card card-body"><dl class="row mb-0"><dt class="col-sm-3">Telegram API</dt><dd class="col-sm-9">{{ '已配置' if configured else '未配置' }}</dd><dt class="col-sm-3">SOCKS5 代理</dt><dd class="col-sm-9">{{ proxy[1] ~ ':' ~ proxy[2] if proxy else '未配置' }}</dd><dt class="col-sm-3">监听地址</dt><dd class="col-sm-9"><code>{{ host }}:{{ port }}</code></dd><dt class="col-sm-3">数据目录</dt><dd class="col-sm-9"><code>data/</code></dd><dt class="col-sm-3">调用策略</dt><dd class="col-sm-9">FloodWait 后切换 API ID 继续任务；5 个 ID 均限流时停止</dd></dl></div>{% endblock %}
