name: xianyu.bot

networks:
  default:
    name: xianyu.bot

volumes:
  postgres:
  rustfs:
  internal-auth:

services:
  web:
    build:
      context: ./agent-web
      dockerfile: ./Dockerfile
    container_name: xianyu.bot.web
    restart: always
    ports:
      - '18080:8080'
    depends_on:
      - server

  server:
    build:
      context: ./server
      dockerfile: ./Dockerfile
    entrypoint: ["/bin/sh", "-ec", "umask 077; test -s /run/xy/token || (head -c 32 /dev/urandom | base64 > /run/xy/token.tmp && mv /run/xy/token.tmp /run/xy/token); exec ./server -c config.docker.yaml"]
    volumes:
      - internal-auth:/run/xy
    container_name: xianyu.bot.server
    restart: always
    ports:
      - '18888:8888'
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      XY_CREDENTIAL_KEY: ${XY_CREDENTIAL_KEY:-}
      XIANYU_JWT_SIGNING_KEY: ${XIANYU_JWT_SIGNING_KEY:-change-this-before-production}
      XIANYU_POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-xianyu_bot}
      TELEGRAM_SERVICE_URL: http://telegram:8080
      RUSTFS_ENDPOINT: http://rustfs:9000
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-rustfs-local}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:-rustfs-local-secret}
      RUSTFS_BUCKET: ${RUSTFS_BUCKET:-telegram-resources}

  postgres:
    image: postgres:19rc1-alpine
    container_name: xianyu.bot.postgres
    restart: always
    ports:
      - '${PGSQL_HOST_PORT:-15432}:5432'
    environment:
      POSTGRES_DB: xianyu_bot
      POSTGRES_USER: xianyu_bot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-xianyu_bot}
      TZ: Asia/Shanghai
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U xianyu_bot -d xianyu_bot']
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - postgres:/var/lib/postgresql
      - ./server/internal/infra/migrations/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro

  rustfs:
    image: rustfs/rustfs:latest
    container_name: xianyu.bot.rustfs
    restart: always
    command: ['--address', ':9000', '--console-enable', '--console-address', ':9001', '/data']
    ports:
      - '${RUSTFS_API_HOST_PORT:-19000}:9000'
      - '${RUSTFS_CONSOLE_HOST_PORT:-19001}:9001'
    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-rustfs-local}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:-rustfs-local-secret}
      RUSTFS_ADDRESS: ':9000'
      RUSTFS_CONSOLE_ADDRESS: ':9001'
      RUSTFS_CONSOLE_ENABLE: 'true'
    volumes:
      - rustfs:/data

  telegram:
    build:
      context: ./telegram.bot
      dockerfile: Dockerfile
    container_name: xianyu.bot.telegram
    restart: unless-stopped
    env_file:
      - path: ./telegram.bot/.env
        required: false
    environment:
      DATABASE_URL: postgresql://xianyu_bot:${POSTGRES_PASSWORD:-xianyu_bot}@postgres:5432/xianyu_bot
      XIANYU_INTERNAL_URL: http://server:8888
      TG_RESOURCE_CONCURRENCY: ${TG_RESOURCE_CONCURRENCY:-1}
      TG_RESOURCE_MAX_FILE_MB: ${TG_RESOURCE_MAX_FILE_MB:-200}
      TG_RESOURCE_AI_BASE_URL: ${TG_RESOURCE_AI_BASE_URL:-}
      TG_RESOURCE_AI_API_KEY: ${TG_RESOURCE_AI_API_KEY:-}
      TG_RESOURCE_AI_MODEL: ${TG_RESOURCE_AI_MODEL:-}
      TELEGRAM_TMP_ROOT: /workspace/tmp/telegram
      TG_API_CREDENTIAL_SOURCE: ${TG_API_CREDENTIAL_SOURCE:-database}
      RUSTFS_ENDPOINT: http://rustfs:9000
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-rustfs-local}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:-rustfs-local-secret}
      RUSTFS_BUCKET: ${RUSTFS_BUCKET:-telegram-resources}
      RUSTFS_REGION: ${RUSTFS_REGION:-us-east-1}
    depends_on:
      postgres:
        condition: service_healthy
      server:
        condition: service_started
      rustfs:
        condition: service_started
    ports:
      - '127.0.0.1:18081:8080'
    volumes:
      - internal-auth:/run/xy:ro
      - ./tmp:/workspace/tmp
