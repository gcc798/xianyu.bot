jwt:
  signing-key: change-me
  expires-time: 7d
  buffer-time: 1d
  issuer: xianyu.bot

log:
  level: info
  format: console
  show-line: true

email:
  to: ""
  port: 465
  from: ""
  host: ""
  is-ssl: true
  secret: ""
  nickname: xianyu.bot

http:
  port: 8888

mcp:
  catalog-scan-interval-seconds: 30
  catalog-refresh-concurrency: 4
  health-check-interval-seconds: 60
  health-check-concurrency: 8
  connection-sweep-interval-seconds: 30

rabbitmq:
  url: amqp://xianyu_bot:xianyu_bot@127.0.0.1:15672/
  prefetch: 8
  publish-timeout-seconds: 10
  retry-short-ttl-seconds: 10
  retry-medium-ttl-seconds: 60
  retry-long-ttl-seconds: 300

worker:
  health-port: 8889

postgres:
  host: 127.0.0.1
  port: "15432"
  parameters: "sslmode=disable TimeZone=Asia/Shanghai"
  database: xianyu_bot
  username: xianyu_bot
  password: change-me
  max-idle-conns: 10
  max-open-conns: 100
  conn-max-lifetime: 0
  log-level: info
