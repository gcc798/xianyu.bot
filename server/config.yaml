jwt:
  signing-key: qmPlus
  expires-time: 7d
  buffer-time: 1d
  issuer: xianyu-assistant

zap:
  level: info
  format: console
  prefix: "[xianyu-assistant]"
  director: log
  show-line: true
  encode-level: LowercaseColorLevelEncoder
  stacktrace-key: stacktrace
  log-in-console: true
  retention-day: -1

email:
  to: xxx@qq.com
  port: 465
  from: xxx@163.com
  host: smtp.163.com
  is-ssl: true
  secret: xxx
  nickname: xianyu-assistant

system:
  addr: 8888
  db-type: pgsql
  router-prefix: ""

pgsql:
  path: 127.0.0.1
  port: "15432"
  config: "sslmode=disable TimeZone=Asia/Shanghai"
  db-name: xianyu_assistant_v2
  username: xianyu
  password: xianyu_assistant
  max-idle-conns: 10
  max-open-conns: 100
  conn-max-lifetime: 0
  log-mode: ""
  log-zap: false
